import java.text.SimpleDateFormat
import java.util.TimeZone

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// 빌드 시각(KST) — 어느 빌드가 도는지 앱에서 확인용
def buildStamp = {
    def fmt = new SimpleDateFormat("yyyy-MM-dd HH:mm")
    fmt.setTimeZone(TimeZone.getTimeZone("Asia/Seoul"))
    return fmt.format(new Date())
}()
// 버전명 = 빌드 날짜(자동). 상단바 표시가 항상 실제 빌드일과 일치
def versionByDate = {
    def fmt = new SimpleDateFormat("yyyy.MM.dd")
    fmt.setTimeZone(TimeZone.getTimeZone("Asia/Seoul"))
    return fmt.format(new Date())
}()
// versionCode = 빌드 시각(분 단위, epoch) 자동 증가 → OTA(자동 업데이트)가
//   "릴리스가 설치본보다 최신인지"를 정수 비교로 정확히 판별.
def autoVersionCode = (int)(System.currentTimeMillis() / 60000L)

// 현재 git 짧은 해시(없으면 nogit)
def gitShortSha = {
    try {
        def p = ["git", "rev-parse", "--short", "HEAD"].execute(null, rootDir)
        p.waitFor()
        def s = p.in.text.trim()
        return s ? s : "nogit"
    } catch (ignored) { return "nogit" }
}()

android {
    namespace 'com.pone.towerccctv'
    compileSdk 34

    defaultConfig {
        applicationId "com.pone.towerccctv"
        minSdk 24
        targetSdk 34
        versionCode autoVersionCode  // 자동 증가(빌드 분). OTA 최신판별용
        versionName versionByDate   // 빌드 날짜 자동 (예: 2026.07.09)
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }

        buildConfigField "String", "BUILD_STAMP", "\"${buildStamp}\""
        buildConfigField "String", "GIT_SHA", "\"${gitShortSha}\""
    }

    buildFeatures { viewBinding true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packagingOptions { jniLibs { useLegacyPackaging true } }
}

dependencies {
    implementation 'org.videolan.android:libvlc-all:3.6.0'
    // ML Kit OCR (계측기 수치 인식, 오프라인 작동)
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.github.rburgst:okhttp-digest:3.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
// 아래 내용을 dependencies { } 블록 안에 추가
